        '<div style="margin-top:12px;padding:11px;border:1px solid var(--v1-line);border-radius:12px;background:#fff;">' +
          '<div style="display:flex;align-items:center;justify-content:space-between;gap:8px;"><strong style="font-size:12px;">وضعیت پرداخت</strong><span class="payment-status-chip">'+esc(getInvoicePaymentLabel(v))+'</span></div>' +
          (invoiceIsPaymentTracked(v) ? '<div class="small muted" style="margin-top:6px;">پرداخت‌شده: '+formatToman(getInvoicePaid(v))+' · مانده: '+formatToman(getInvoiceBalance(v))+' · سررسید: '+formatFaDate(getInvoiceDueDate(v))+'</div>' : '<div class="small muted" style="margin-top:6px;">این فاکتور از نسخهٔ قبلی آمده یا وضعیت پرداخت آن ثبت نشده است؛ برای جلوگیری از محاسبهٔ اشتباه بدهی، هنوز در جمع مطالبات لحاظ نشده.</div>') +
          '<div class="flex gap-2" style="flex-wrap:wrap;margin-top:9px;">' +
            (invoiceIsPaymentTracked(v) ? (getInvoiceBalance(v)>0 ? '<button class="btn btn-primary btn-sm" data-action="open-payment-record" data-id="'+v.id+'">'+icon("plus",13)+'ثبت پرداخت</button>' : '<span class="small" style="color:var(--green);font-weight:800;">تسویه کامل</span>') : '<button class="btn btn-primary btn-sm" data-action="open-payment-status" data-id="'+v.id+'">ثبت وضعیت پرداخت</button>') +
            '<button class="btn btn-outline btn-sm" data-action="open-payments">همهٔ پرداخت‌ها</button>' +
          '</div>' +
        '</div>' +
      "</div>" +
    "</div></div>"
  );
}

function openPaymentRecord(invoiceId) {
  const v = state.visits.find(x=>x.id===invoiceId);
  if (!v || !v.items || !v.items.length) return;
  if (!invoiceIsPaymentTracked(v)) { openPaymentStatus(invoiceId); return; }
  state.modal = { type:"payment-record", invoiceId, form:{ amount:String(getInvoiceBalance(v)), method:PAYMENT_RECEIPT_METHODS.includes(v.paymentMethod) ? v.paymentMethod : "نقد", reference:"", note:"", date:todayISO() } };
  render();
}
function openPaymentStatus(invoiceId) {
  const v = state.visits.find(x=>x.id===invoiceId);
  if (!v) return;
  state.modal = { type:"payment-status", invoiceId, form:{ status:"unpaid", paymentTermsDays:String(v.paymentTermsDays != null ? v.paymentTermsDays : 7) } };
  render();
}
async function savePaymentRecord() {
  const m=state.modal; if(!m || m.type!=="payment-record") return;
  const v=state.visits.find(x=>x.id===m.invoiceId); if(!v) return;
  const amount=Number(m.form.amount)||0;
  const balance=getInvoiceBalance(v);
  if(amount<=0){showToast("مبلغ پرداخت باید بیشتر از صفر باشد");return;}
  if(amount>balance){showToast("مبلغ پرداخت از ماندهٔ فاکتور بیشتر است");return;}
  const method=m.form.method||"نقد";
  const payment={id:uid(),date:m.form.date||todayISO(),amount,method,status:method==="چک"?"pending":"cleared",reference:(m.form.reference||"").trim(),note:(m.form.note||"").trim()};
  state.visits=state.visits.map(x=>x.id===v.id?Object.assign({},x,{paymentTracking:true,payments:invoicePayments(x).concat([payment])}):x);
  await saveVisits(); state.modal={type:"payments"}; showToast(method==="چک"?"چک ثبت شد؛ تا زمان وصول تسویه محسوب نمی‌شود":"پرداخت ثبت شد"); render();
}
async function savePaymentStatus() {
  const m=state.modal; if(!m || m.type!=="payment-status") return;
  const v=state.visits.find(x=>x.id===m.invoiceId); if(!v) return;
  const terms=Math.max(0,Math.min(3650,Number(m.form.paymentTermsDays)||0));
  let payments=invoicePayments(v);
  if(m.form.status==="paid") payments=[{id:uid(),date:todayISO(),amount:getVisitTotal(v),method:"تأیید دستی",status:"cleared",reference:"",note:"وضعیت پرداخت توسط کاربر تأیید شد"}];
  state.visits=state.visits.map(x=>x.id===v.id?Object.assign({},x,{paymentTracking:true,paymentTermsDays:terms,dueDate:addDaysISO(x.date||todayISO(),terms),payments}):x);
  await saveVisits(); state.modal={type:"payments"}; showToast(m.form.status==="paid"?"فاکتور به‌عنوان تسویه‌شده ثبت شد":"پیگیری بدهی این فاکتور فعال شد"); render();
}
async function updateChequeStatus(paymentId, status) {
  let found=false;
  state.visits=state.visits.map(v=>{
    if(!invoicePayments(v).some(p=>p.id===paymentId)) return v;
    found=true;
    return Object.assign({},v,{payments:invoicePayments(v).map(p=>p.id===paymentId?Object.assign({},p,{status}):p)});
  });
  if(found){await saveVisits();showToast(status==="cleared"?"وصول چک ثبت شد":"برگشت چک ثبت شد");}
  state.modal={type:"payments"};render();
}
function renderPaymentsModal() {
  const o=getPaymentOverview();
  const rows=o.invoices.slice().sort((a,b)=>{
    const au=invoiceIsPaymentTracked(a)&&getInvoiceBalance(a)>0?1:0, bu=invoiceIsPaymentTracked(b)&&getInvoiceBalance(b)>0?1:0;
    if(au!==bu)return bu-au;
    if(isInvoiceOverdue(a)!==isInvoiceOverdue(b))return isInvoiceOverdue(a)?-1:1;
    return (b.date||"").localeCompare(a.date||"");
  });
  return '<div class="modal-backdrop"><div class="modal-sheet" style="padding:0;max-height:92vh;">'+
    '<div class="modal-head" style="padding:15px 17px;border-bottom:1px solid var(--v1-line);margin:0;"><div><div class="modal-title serif">پیگیری پرداخت‌ها</div><div class="small muted" style="margin-top:3px;">مطالبات، سررسیدها و وضعیت چک‌ها</div></div><button data-action="close-modal">'+icon("x",20)+'</button></div>'+
    '<div style="padding:13px 15px 22px;">'+
      '<div class="payment-summary-grid">'+
        '<div class="payment-summary-box"><span class="small muted">ماندهٔ مطالبات</span><strong>'+formatToman(o.receivables)+'</strong></div>'+
        '<div class="payment-summary-box"><span class="small muted">مطالبات سررسیدگذشته</span><strong style="color:'+(o.overdueAmount>0?'var(--brick)':'var(--ink)')+'">'+formatToman(o.overdueAmount)+'</strong></div>'+
        '<div class="payment-summary-box"><span class="small muted">فاکتورهای باز</span><strong>'+formatFaNum(o.open.length)+'</strong></div>'+
        '<div class="payment-summary-box"><span class="small muted">چک در انتظار وصول</span><strong>'+formatFaNum(o.pendingCheques)+'</strong></div>'+
      '</div>'+
      (o.untracked.length?'<div class="card" style="padding:10px 11px;margin-bottom:12px;border-color:#E7D3A7;background:#FFFCF5;"><div style="font-weight:800;font-size:12px;">'+formatFaNum(o.untracked.length)+' فاکتور قدیمی بدون وضعیت پرداخت</div><div class="small muted" style="line-height:1.8;margin-top:3px;">این فاکتورها تا زمان تأیید شما بدهی قطعی محسوب نمی‌شوند. از دکمهٔ «ثبت وضعیت» برای تعیین وضعیت واقعی استفاده کنید.</div></div>':'')+
      (rows.length?'<div class="flex-col gap-2">'+rows.map(v=>{
        const c=state.customers.find(x=>x.id===v.customerId), tracked=invoiceIsPaymentTracked(v), bal=tracked?getInvoiceBalance(v):0;
        const pending=invoicePayments(v).filter(p=>p.method==="چک"&&p.status==="pending");
        const returned=invoicePayments(v).filter(p=>p.method==="چک"&&p.status==="returned");
        const history=invoicePayments(v);
        return '<div class="payment-list-row '+(isInvoiceOverdue(v)?'overdue':'')+'">'+
          '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;"><div style="min-width:0;"><strong style="font-size:12px;">'+esc(c?c.name:"مشتری حذف‌شده")+'</strong><div class="small muted" style="margin-top:3px;">فاکتور #'+formatFaNum(v.invoiceNumber||"—")+' · '+formatFaDate(v.date)+'</div></div><span class="payment-status-chip" style="'+(isInvoiceOverdue(v)?'background:#FBE9E7;color:#A33B32;':'')+'">'+esc(getInvoicePaymentLabel(v))+'</span></div>'+
          '<div style="display:flex;justify-content:space-between;gap:8px;font-size:11px;"><span class="muted">جمع فاکتور: '+formatToman(getVisitTotal(v))+'</span><strong style="color:'+(bal>0&&isInvoiceOverdue(v)?'var(--brick)':'var(--ink)')+'">'+(tracked?'مانده: '+formatToman(bal):'وضعیت نامشخص')+'</strong></div>'+
          (tracked?'<div class="small muted">سررسید: '+formatFaDate(getInvoiceDueDate(v))+' · پرداخت قطعی: '+formatToman(getInvoicePaid(v))+'</div>':'')+
          (pending.length?'<div style="background:#F4F7FB;border-radius:9px;padding:7px 8px;font-size:10px;">'+pending.map(p=>'چک '+(p.reference?'شماره '+esc(p.reference):'بدون شماره')+' · '+formatToman(p.amount)+' · '+formatFaDate(p.date)+' <button class="btn btn-primary btn-sm" style="margin-inline-start:5px;" data-action="clear-cheque" data-id="'+p.id+'">ثبت وصول</button> <button class="btn btn-outline btn-sm" data-action="return-cheque" data-id="'+p.id+'">برگشتی</button>').join('<div style="margin-top:5px;">')+'</div>':'')+
          (returned.length?'<div class="small" style="color:var(--brick);">چک برگشتی: '+returned.map(p=>formatToman(p.amount)).join('، ')+'</div>':'')+
          (history.length?'<div style="border-top:1px solid var(--v1-line);padding-top:5px;">'+history.map(p=>'<div class="payment-history-item">'+formatFaDate(p.date)+' · '+esc(p.method)+' · '+formatToman(p.amount)+' · '+(p.status==="cleared"?'قطعی':p.status==="pending"?'در انتظار وصول':'برگشتی')+(p.reference?' · شماره/مرجع '+esc(p.reference):'')+(p.note?' · '+esc(p.note):'')+'</div>').join('')+'</div>':'')+
          '<div class="payment-list-actions">'+(tracked?(bal>0?'<button class="btn btn-primary" data-action="open-payment-record" data-id="'+v.id+'">'+icon("plus",12)+'ثبت دریافت وجه / چک</button>':''):'<button class="btn btn-primary" data-action="open-payment-status" data-id="'+v.id+'">ثبت وضعیت پرداخت</button>')+'<button class="btn btn-outline" data-action="view-invoice" data-id="'+v.id+'">نمایش فاکتور</button></div>'+
        '</div>';
      }).join('')+'</div>': '<div class="card small muted" style="text-align:center;">هنوز فاکتوری ثبت نشده است.</div>')+
    '</div></div></div>';
}
function renderPaymentRecordModal(m) {
  const v=state.visits.find(x=>x.id===m.invoiceId); if(!v)return '';
  const f=m.form;
  const methods=PAYMENT_RECEIPT_METHODS;
  return '<div class="modal-backdrop center"><div class="modal-sheet">'+
    '<div class="modal-head"><span class="modal-title serif">ثبت پرداخت مشتری</span><button data-action="close-modal">'+icon("x",20)+'</button></div>'+
    '<div class="card" style="padding:10px;margin-bottom:12px;"><div class="small muted">فاکتور #'+formatFaNum(v.invoiceNumber||"—")+'</div><strong>'+formatToman(getInvoiceBalance(v))+' ماندهٔ قابل پرداخت</strong></div>'+
    '<div class="flex-col gap-3">'+field("مبلغ دریافت‌شده",'<input class="input" type="number" min="1" max="'+getInvoiceBalance(v)+'" data-field="amount" value="'+esc(f.amount)+'"/>')+
    field("روش دریافت",select("method",methods,f.method))+
    field("تاریخ دریافت / ثبت چک",'<input class="input" type="date" data-field="date" value="'+esc(f.date||todayISO())+'"/>')+
    field("شماره چک یا مرجع پرداخت (اختیاری)",'<input class="input" data-field="reference" value="'+esc(f.reference||"")+'" placeholder="شماره چک / پیگیری بانکی"/>')+
    field("یادداشت (اختیاری)",'<textarea class="textarea" rows="2" data-field="note">'+esc(f.note||"")+'</textarea>')+
    '<div class="small muted" style="line-height:1.8;">'+(f.method==="چک"?'چک تا زمان ثبت «وصول» در ماندهٔ بدهی باقی می‌ماند.':'این پرداخت پس از ثبت، از ماندهٔ بدهی کسر می‌شود.')+'</div>'+
    '<div class="v1-action-bar"><button class="btn btn-outline" data-action="close-modal">انصراف</button><button class="btn btn-primary" data-action="save-payment-record">ثبت پرداخت</button></div></div>'+
    '</div></div>';
}
function renderPaymentStatusModal(m) {
  const v=state.visits.find(x=>x.id===m.invoiceId); if(!v)return '';
  const f=m.form;
  return '<div class="modal-backdrop center"><div class="modal-sheet">'+
    '<div class="modal-head"><span class="modal-title serif">تعیین وضعیت فاکتور قدیمی</span><button data-action="close-modal">'+icon("x",20)+'</button></div>'+
    '<div class="small muted" style="line-height:1.8;margin-bottom:10px;">فاکتور #'+formatFaNum(v.invoiceNumber||"—")+' · '+formatToman(getVisitTotal(v))+'<br/>این مرحله برای جلوگیری از ثبت اشتباه بدهی فاکتورهای نسخه‌های قبلی است.</div>'+
    field("وضعیت واقعی پرداخت",select("status",[{value:"paid",label:"پرداخت شده / تسویه قطعی"},{value:"unpaid",label:"پرداخت نشده / هنوز بدهکار است"}],f.status))+
    '<div style="margin-top:10px;">'+field("مهلت تسویه از تاریخ فاکتور (روز)",'<input class="input" type="number" min="0" max="3650" data-field="paymentTermsDays" value="'+esc(f.paymentTermsDays)+'"/>')+'</div>'+
    '<div class="v1-action-bar" style="margin-top:14px;"><button class="btn btn-outline" data-action="close-modal">انصراف</button><button class="btn btn-primary" data-action="save-payment-status">ثبت وضعیت</button></div>'+
    '</div></div>';
}

function renderConfirm() {
  if (!state.confirm) return "";
  return (
    '<div class="modal-backdrop center"><div class="modal-sheet" style="max-width:320px;">' +
      '<div class="flex gap-2" style="align-items:flex-start;margin-bottom:10px;">' + icon("alert", 20) + '<p style="font-size:13px;line-height:1.8;margin:0;">' + esc(state.confirm.message) + "</p></div>" +
      '<div class="flex gap-2" style="justify-content:flex-end;">' +
        '<button class="btn btn-outline btn-sm" data-action="close-confirm">انصراف</button>' +
        '<button class="btn btn-sm" style="background:var(--brick);color:#fff;" data-action="confirm-yes">تایید</button>' +
      "</div>" +
    "</div></div>"
  );
}

/* ---- small render helpers ---- */
function field(label, inner) { return '<div class="field"><span class="field-label">' + label + "</span>" + inner + "</div>"; }
function select(fieldName, options, value) {
  return '<select class="select" data-field="' + fieldName + '">' + options.map((o) => { const val=(o && typeof o === "object")?o.value:o; const label=(o && typeof o === "object")?o.label:o; return '<option value="' + esc(val) + '"' + (String(val) === String(value) ? " selected" : "") + ">" + esc(label) + "</option>"; }).join("") + "</select>";
}

/* ================================================================== */
/* boot                                                                 */
/* ================================================================== */

loadAll();

// Flush the latest wizard draft when the page is backgrounded or closed.
window.addEventListener("pagehide", () => { persistWizardStateNow(); });
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") persistWizardStateNow();
});

// wizard delegated inputs
document.addEventListener("change", (e) => {
  const t = e.target;
  const action = t.getAttribute("data-action");
  if (t.dataset.productSort !== undefined) { state.productSort=t.value; render(); return; }
  if (!action) return;
  const id = t.getAttribute("data-id");
  if (action === "wizard-toggle") { wizardToggleItem(id, t.checked); }
  if (action === "wizard-supplier") { wizardChangeSupplier(id, t.value); }
  if (action === "wizard-qty") { wizardSetQty(id, t.value); }
  if (action === "wizard-customer" && state.wizard) { state.wizard.customerId = t.value; scheduleWizardStateSave(); }
});
document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.getAttribute("data-action") === "wizard-qty") {
    wizardSetQtySilent(t.getAttribute("data-id"), t.value);
  } else if (t.getAttribute("data-action") === "wizard-payment-terms" && state.wizard) {
    state.wizard.paymentTermsDays = Math.max(0, Math.min(3650, Number(t.value) || 0));
    scheduleWizardStateSave();
  }
});


/* SW_REGISTER_START */
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("service-worker.js").catch(() => {});
  });
}
/* SW_REGISTER_END */
</script>
</body>
</html>
