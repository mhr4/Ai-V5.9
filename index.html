<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Sales AI · دستیار میدانی فروش</title>
<!-- PWA_HEAD_START -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#111927" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Sales AI V5.16" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="icon" href="icon-192.png" />
<!-- PWA_HEAD_END -->
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=Noto+Serif+Arabic:wght@600;700;900&display=swap');

:root{
  --ink:#1E2A38;
  --ink-soft:#5B6472;
  --paper:#F3EFE6;
  --card:#FBF8F2;
  --line:#DDD5C4;
  --amber:#111927;
  --amber-bg:#E9EDF3;
  --amber-dark:#111927;
  --green:#4B7A5A;
  --green-bg:#DCEADF;
  --brick:#B24B3C;
  --brick-bg:#F3D9D2;
  --blue:#3B6B8C;
  --blue-bg:#D9E6ED;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Vazirmatn',sans-serif;
  background:var(--paper);
  color:var(--ink);
  -webkit-tap-highlight-color:transparent;
}
.serif{font-family:'Noto Serif Arabic',serif;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select,textarea{font-family:inherit;font-size:14px;}
a{color:inherit;}
#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;position:relative;background:var(--paper);}

/* header */
.app-header{padding:22px 20px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);}
.brand-title{font-size:22px;font-weight:800;}
.brand-sub{font-size:11px;color:var(--ink-soft);margin-top:2px;}
.version-badge{font-size:10px;font-weight:700;background:var(--amber-bg);color:var(--amber-dark);padding:2px 8px;border-radius:999px;margin-inline-start:6px;}
.icon-btn{padding:8px;border-radius:999px;color:var(--ink-soft);}
.icon-btn:active{background:var(--card);}

/* main */
main{flex:1;overflow-y:auto;padding-bottom:90px;}
.px{padding-left:20px;padding-right:20px;}
.section{padding:20px 20px 0;display:flex;flex-direction:column;gap:16px;}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;}
.card-title{font-size:13px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:6px;}


/* stat grid */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.stat-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;}
.stat-card.wide{grid-column:1 / -1;}
.stat-label{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:var(--ink-soft);margin-bottom:4px;}
.stat-value{font-size:19px;font-weight:800;}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:800;font-size:13px;border-radius:12px;padding:11px 16px;}
.btn-primary{background:var(--amber-dark);color:#fff;}
.btn-primary:disabled{opacity:.4;}
.btn-outline{background:var(--card);color:var(--ink-soft);border:1px solid var(--line);}
.btn-soft-green{background:var(--green-bg);color:var(--green);}
.btn-soft-amber{background:var(--amber-bg);color:var(--amber-dark);}
.btn-soft-brick{background:var(--brick-bg);color:var(--brick);}
.btn-sm{padding:7px 12px;font-size:12px;border-radius:10px;}
.btn-block{width:100%;}
.btn-icon{padding:8px;border-radius:10px;}

/* inputs */
.field{display:flex;flex-direction:column;gap:5px;}
.field-label{font-size:11px;font-weight:700;color:var(--ink-soft);}
.input,.select,.textarea{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:14px;color:var(--ink);outline:none;}
.input:focus,.select:focus,.textarea:focus{border-color:var(--amber-dark);}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.search-wrap{position:relative;flex:1;}
.search-wrap .input{padding-inline-end:34px;}
.search-icon{position:absolute;inset-inline-end:11px;top:50%;transform:translateY(-50%);color:var(--ink-soft);}

/* badges */
.badge{display:inline-flex;align-items:center;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;}

/* nav */
nav.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--card);border-top:1px solid var(--line);display:grid;padding:8px 6px;z-index:30;}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px;border-radius:12px;color:var(--ink-soft);font-size:10px;font-weight:800;}
.nav-btn.active{color:var(--amber-dark);}
.nav-btn svg{width:20px;height:20px;}

/* modal */
.modal-backdrop{position:fixed;inset:0;background:rgba(30,42,56,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
.modal-backdrop.center{align-items:center;padding:20px;}
.modal-sheet{width:100%;max-width:480px;max-height:88vh;overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:18px 18px 24px;}
.smart-wizard-fullscreen{position:fixed!important;inset:0!important;width:100vw!important;max-width:none!important;height:100dvh!important;max-height:none!important;border-radius:0!important;border:0!important;padding:14px 14px calc(24px + env(safe-area-inset-bottom))!important;overflow:hidden!important;display:flex!important;flex-direction:column!important;} .smart-wizard-fullscreen .wizard-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;padding-bottom:12px;display:flex;flex-direction:column;} .smart-wizard-fullscreen .wizard-products-list{flex:1 1 auto;min-height:55vh;overflow-y:auto;overflow-x:hidden;padding:2px 2px 16px;} .smart-wizard-fullscreen .wizard-actions{flex:0 0 auto;padding-top:10px;background:var(--card);position:sticky;bottom:0;z-index:3;}
.modal-backdrop.center .modal-sheet{border-radius:18px;max-width:340px;}
.modal-head{display:flex;align-items:center;justify-content:between;justify-content:space-between;margin-bottom:14px;}
.modal-title{font-weight:800;font-size:16px;}

/* item rows */
.item-row{display:flex;gap:6px;align-items:center;}
.item-row .select{flex:2;}
.item-row .input{flex:1;text-align:center;}

/* empty state */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:56px 24px;}
.empty-icon{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:16px;color:var(--amber-dark);}
.empty-title{font-weight:800;font-size:16px;}
.empty-sub{font-size:13px;color:var(--ink-soft);}

/* rows */
.row-card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.chip{font-size:11px;font-weight:800;padding:5px 12px;border-radius:999px;background:var(--card);color:var(--ink-soft);border:1px solid var(--line);white-space:nowrap;}
.chip.active{background:var(--amber-dark);color:#fff;border-color:var(--amber-dark);}


/* invoice print */
.invoice-box{padding:22px;}
.invoice-head{display:flex;align-items:flex-start;justify-content:space-between;padding-bottom:14px;border-bottom:2px solid var(--ink);}
table.inv-table{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px;}
table.inv-table th{text-align:right;font-size:11px;color:var(--ink-soft);padding:8px 4px;border-bottom:1px solid var(--line);}
table.inv-table td{padding:8px 4px;border-bottom:1px dashed var(--line);}
table.inv-table th:nth-child(2),table.inv-table td:nth-child(2){text-align:center;}
table.inv-table th:nth-child(3),table.inv-table td:nth-child(3),
table.inv-table th:nth-child(4),table.inv-table td:nth-child(4){text-align:left;}
.inv-total{display:flex;align-items:center;justify-content:space-between;padding-top:14px;margin-top:14px;border-top:2px solid var(--ink);font-weight:800;font-size:16px;}
@media (max-width:420px){
  .invoice-box{padding:12px;}
  .invoice-box .serif{font-size:15px !important;}
  table.inv-table{font-size:11px;}
  table.inv-table th,table.inv-table td{padding:5px 3px;}
  .inv-total{font-size:13px;padding-top:10px;margin-top:10px;}
  .invoice-head{padding-bottom:10px;}
}

/* invoice catalog actions */
.invoice-mini-secondary{flex:0 0 auto;min-width:29px;height:29px;padding:0 7px;border:1px solid var(--v1-line);border-radius:8px;background:var(--v1-primary-soft);color:var(--v1-primary);font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;}
.invoice-mini-secondary:active{transform:scale(.97);}

/* ai card */
.ai-result{white-space:pre-wrap;line-height:1.9;font-size:13px;color:var(--ink);}


/* dashboard V5 — visual language based on V1.1 reference */
.dashboard-v5{gap:14px;}
.dashboard-v5-heading{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;}
.dashboard-v5-title{font-size:19px;font-weight:900;margin-top:3px;}
.dashboard-v5-date{font-size:11px;color:var(--ink-soft);text-align:left;white-space:nowrap;}
.dashboard-v5-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.dashboard-v5-stats .stat-card{min-height:72px;padding:12px 13px;border-radius:17px;}
.dashboard-v5-stats .stat-value{font-size:18px;margin-top:5px;}
.dashboard-v5-primary{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;background:#111927;color:#fff;border-radius:18px;padding:16px;font-family:inherit;font-size:15px;font-weight:900;box-shadow:0 5px 12px rgba(17,25,39,.08);}
.dashboard-v5-primary:active{transform:scale(.99);}
.dashboard-v5-smart{width:100%;display:flex;align-items:center;gap:10px;text-align:right;background:var(--amber-bg);border:1px solid #e7c98f;border-radius:17px;padding:12px 13px;color:var(--ink);}
.dashboard-v5-smart-icon{width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:#fff;color:var(--amber-dark);flex:0 0 auto;}
.dashboard-v5-smart-copy{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1;}
.dashboard-v5-smart-copy strong{font-size:13px;}
.dashboard-v5-smart-copy small{font-size:10px;color:var(--ink-soft);}
.dashboard-v5-arrow{color:var(--amber-dark);display:flex;}
.dashboard-v5-section-title{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px;font-weight:900;margin:2px 2px 7px;}
.dashboard-v5-section-meta{font-size:10px;color:var(--ink-soft);font-weight:600;}
.dashboard-v5-quick{display:flex;flex-direction:column;gap:9px;}
.dashboard-v5-quick-card{width:100%;display:flex;align-items:center;gap:11px;text-align:right;background:var(--card);border:1px solid var(--line);border-radius:17px;padding:12px 11px;}
.dashboard-v5-quick-icon{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:13px;background:#eef1f5;color:var(--ink);flex:0 0 auto;}
.dashboard-v5-quick-card>span:nth-child(2){display:flex;flex-direction:column;gap:3px;min-width:0;flex:1;}
.dashboard-v5-quick-card strong{font-size:13px;}
.dashboard-v5-quick-card small{font-size:10px;color:var(--ink-soft);}
.dashboard-v5-quick-action{font-size:10px;font-weight:800;background:#f0f2f5;color:var(--ink-soft);padding:7px 9px;border-radius:10px;white-space:nowrap;}
.dashboard-v5-block{margin-top:2px;}
.dashboard-v5-list{display:flex;flex-direction:column;gap:8px;}
.dashboard-v5-list .row-card{border-radius:15px;}
.dashboard-v5-activity{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;}
.dashboard-v5-activity-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 13px;border-bottom:1px solid var(--line);}
.dashboard-v5-activity-row:last-child{border-bottom:0;}
.dashboard-v5-activity-row>div{display:flex;flex-direction:column;gap:2px;min-width:0;}
.dashboard-v5-activity-row strong{font-size:12px;}
.dashboard-v5-activity-row small{font-size:10px;color:var(--ink-soft);}
.dashboard-v5-activity-row>span{font-size:12px;font-weight:800;color:var(--green);white-space:nowrap;}
.dashboard-v5-last{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;}
.dashboard-v5-last div{display:flex;flex-direction:column;gap:3px;}
.dashboard-v5-last small{font-size:10px;color:var(--ink-soft);}
.dashboard-v5-last strong{font-size:12px;}
.dashboard-v5-last>span{font-size:13px;font-weight:900;color:var(--green);}
@media (max-width:420px){
  .dashboard-v5-title{font-size:17px;}
  .dashboard-v5-date{font-size:10px;}
}
.dashboard-v5-location-note{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--v1-muted);margin-top:-5px;padding:0 4px;}
.dashboard-v5-location-note span:last-child{margin-inline-start:auto;}
.dashboard-v5-suggestion .btn-primary{flex:0 0 auto;}
.dashboard-v5-top-products{background:#fff;border:1px solid var(--v1-line);border-radius:15px;overflow:hidden;}
.dashboard-v5-product-row{display:flex;align-items:center;gap:9px;padding:11px 13px;border-bottom:1px solid var(--v1-line);}
.dashboard-v5-product-row:last-child{border-bottom:0;}
.dashboard-v5-rank{width:22px;height:22px;border-radius:8px;background:var(--v1-primary-soft);color:var(--v1-primary);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;flex:0 0 auto;}
.dashboard-v5-product-name{font-size:12px;font-weight:800;min-width:0;flex:1;}
.dashboard-v5-product-qty{font-size:10px;color:var(--v1-muted);white-space:nowrap;}

.daily-plan-card{background:#fff;border:1px solid var(--v1-line);border-radius:18px;padding:13px;margin-top:10px;}
.daily-plan-head{display:flex;align-items:center;gap:10px;}
.daily-plan-icon{width:40px;height:40px;border-radius:13px;background:var(--v1-primary-soft);color:var(--v1-primary);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.daily-plan-copy{min-width:0;flex:1;}
.daily-plan-copy strong{display:block;font-size:14px;}
.daily-plan-copy small{display:block;color:var(--ink-soft);font-size:10px;margin-top:3px;line-height:1.6;}
.daily-plan-badge{font-size:10px;font-weight:900;background:#f0f2f5;color:var(--ink-soft);padding:6px 8px;border-radius:9px;white-space:nowrap;}
.plan-sheet{max-height:92vh;}
.plan-intro{background:#f7f8fa;border:1px solid var(--v1-line);border-radius:15px;padding:11px 12px;font-size:11px;line-height:1.8;color:var(--ink-soft);margin:10px 0;}
.plan-package{border:1px solid var(--v1-line);border-radius:17px;overflow:hidden;background:#fff;margin-top:11px;}
.plan-package-head{padding:12px 13px;background:#fafbfc;border-bottom:1px solid var(--v1-line);display:flex;align-items:center;gap:9px;}
.plan-package-head .pkg-icon{width:34px;height:34px;border-radius:11px;background:var(--v1-primary-soft);color:var(--v1-primary);display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
.plan-package-head strong{font-size:13px;display:block;}
.plan-package-head small{font-size:10px;color:var(--ink-soft);display:block;margin-top:2px;line-height:1.5;}
.plan-route{display:flex;flex-direction:column;}
.plan-stop{display:grid;grid-template-columns:27px 1fr auto;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--v1-line);}
.plan-stop:last-child{border-bottom:0;}
.plan-stop-num{width:25px;height:25px;border-radius:9px;background:#f0f2f5;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;color:var(--ink-soft);}
.plan-stop-main{min-width:0;}
.plan-stop-main strong{font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.plan-stop-main small{display:block;font-size:9px;color:var(--ink-soft);margin-top:3px;line-height:1.5;}
.plan-stop-action{font-size:10px;font-weight:800;color:var(--v1-primary);background:var(--v1-primary-soft);border-radius:9px;padding:7px 8px;white-space:nowrap;}
.plan-empty{padding:24px 14px;text-align:center;color:var(--ink-soft);font-size:11px;line-height:1.8;}
.plan-toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 0;}
.plan-summary{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px;}
.plan-chip{font-size:9px;background:#f4f5f7;border-radius:9px;padding:6px 8px;color:var(--ink-soft);}
.plan-package-footer{padding:10px 12px;border-top:1px solid var(--v1-line);}
.location-sheet{max-height:90vh;}
.location-toolbar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0 11px;border-bottom:1px solid var(--v1-line);}
.location-list{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
.location-row{background:#fff;border:1px solid var(--v1-line);border-radius:14px;padding:11px;display:grid;grid-template-columns:1fr auto;gap:4px 9px;align-items:center;}
.location-main{display:flex;flex-direction:column;gap:2px;min-width:0;}
.location-main strong{font-size:13px;}
.location-main span{font-size:10px;color:var(--v1-primary);font-weight:700;}
.location-last{font-size:10px;color:var(--v1-muted);grid-column:1 / 2;}
 .location-row>.btn{grid-column:2;grid-row:1 / span 2;}
.plan-stop-actions{display:flex;align-items:center;gap:5px;grid-column:3;grid-row:1 / span 2;}
.plan-stop-map{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border:1px solid var(--v1-line);border-radius:10px;background:#fff;color:var(--v1-primary);text-decoration:none;}
.dashboard-v5-suggestion-actions{display:flex;align-items:center;gap:5px;flex:0 0 auto;}
.dashboard-v5-map-btn{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border:1px solid var(--v1-line);border-radius:10px;background:#fff;color:var(--v1-primary);text-decoration:none;}
.location-status{display:flex;align-items:center;gap:7px;padding:18px 4px;font-size:12px;color:var(--v1-muted);}
.location-error{color:var(--brick);}
.location-empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:35px 18px 20px;color:var(--v1-muted);font-size:11px;line-height:1.8;}
.location-empty strong{color:var(--ink);font-size:13px;}
.theme-picker{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.theme-choice{border:1px solid var(--v1-line);background:#fff;border-radius:12px;padding:9px 6px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10px;}
.theme-choice span{width:30px;height:18px;border-radius:8px;display:block;}
.theme-choice.active{border-color:var(--v1-primary);box-shadow:0 0 0 2px var(--v1-primary-soft);}
.theme-navy span{background:#111927}.theme-green span{background:#176B57}.theme-blue span{background:#2563A6}
/* misc */
.muted{color:var(--ink-soft);}
.small{font-size:11px;}
.flex{display:flex;}
.flex-col{display:flex;flex-direction:column;}
.gap-2{gap:8px;}
.gap-3{gap:12px;}
.items-center{align-items:center;}
.justify-between{justify-content:space-between;}
.spin{animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.hidden{display:none !important;}

/* status donut legend */
.legend-dot{width:9px;height:9px;border-radius:999px;display:inline-block;}

@media print{
  body *{visibility:hidden;}
  .print-area,.print-area *{visibility:visible;}
  .print-area{position:fixed;inset:0;padding:24px;background:#fff;}
}

/* ================================================================
   V5 UI refresh — V1.1 visual language
   Smart Visit is explicitly isolated below and keeps its original theme.
   ================================================================ */
:root{
  --v1-primary:#111927;
  --v1-primary-soft:#E9EDF3;
  --v1-paper:#F5F6F8;
  --v1-card:#FFFFFF;
  --v1-line:#E3E6EB;
  --v1-muted:#667085;
}
/* Three lightweight app-wide themes. Smart Visit overrides these variables locally. */
html[data-theme="green"]{
  --v1-primary:#176B57;
  --v1-primary-soft:#E3F1EC;
  --v1-paper:#F4F7F6;
  --v1-card:#FFFFFF;
  --v1-line:#DDE8E4;
  --v1-muted:#65756F;
  --amber:#176B57;--amber-bg:#E3F1EC;--amber-dark:#176B57;
}
html[data-theme="blue"]{
  --v1-primary:#2563A6;
  --v1-primary-soft:#E6EFF9;
  --v1-paper:#F4F7FB;
  --v1-card:#FFFFFF;
  --v1-line:#DCE5F0;
  --v1-muted:#66758A;
  --amber:#2563A6;--amber-bg:#E6EFF9;--amber-dark:#2563A6;
}
html[data-theme="navy"]{
  --v1-primary:#111927;
  --v1-primary-soft:#E9EDF3;

/* STORAGE_BACKEND_START */
const IDB_NAME = "sales-ai-db";
const IDB_VERSION = 1;
const IDB_STORE = "kv";

function openIDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(IDB_NAME, IDB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(IDB_STORE)) {
        db.createObjectStore(IDB_STORE);
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

const DB = {
  async get(key) {
    try {
      const db = await openIDB();
      return await new Promise((resolve, reject) => {
        const tx = db.transaction(IDB_STORE, "readonly");
        const req = tx.objectStore(IDB_STORE).get(key);
        req.onsuccess = () => resolve(req.result === undefined ? null : req.result);
        req.onerror = () => reject(req.error);
      });
    } catch (e) {
      console.error("IDB get", e);
      // fallback localStorage
      try {
        const v = localStorage.getItem(key);
        return v ? JSON.parse(v) : null;
      } catch { return null; }
    }
  },
  async set(key, value) {
    try {
      const db = await openIDB();
      await new Promise((resolve, reject) => {
        const tx = db.transaction(IDB_STORE, "readwrite");
        tx.objectStore(IDB_STORE).put(value, key);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    } catch (e) {
      console.error("IDB set", e);
      try { localStorage.setItem(key, JSON.stringify(value)); } catch (err) { console.error(err); }
    }
  },
  async delete(key) {
    try {
      const db = await openIDB();
      await new Promise((resolve, reject) => {
        const tx = db.transaction(IDB_STORE, "readwrite");
        tx.objectStore(IDB_STORE).delete(key);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    } catch (e) { console.error("IDB delete", e); }
    try { localStorage.removeItem(key); } catch (e) { console.warn("localStorage delete", e); }
  },
  async migrateFromLocalStorage() {
    const keys = ["customers", "products", "visits", "aiAnalysis", "vendorProfile", "companies"];
    let migrated = 0;
    for (const key of keys) {
      try {
        const raw = localStorage.getItem(key);
        if (raw == null) continue;
        const existing = await this.get(key);
        if (existing != null) continue; // already in IDB
        const parsed = JSON.parse(raw);
        await this.set(key, parsed);
        migrated++;
      } catch (e) { console.warn("migrate", key, e); }
    }
    if (migrated > 0) console.log("Sales AI: migrated", migrated, "keys from localStorage → IndexedDB");
    return migrated;
  }
};
/* STORAGE_BACKEND_END */

function getCustomerStatus(c) {

function haversineMeters(lat1, lon1, lat2, lon2) {

function normalizeName(value) {
  return String(value == null ? "" : value).replace(/[يى]/g,"ی").replace(/ك/g,"ک").replace(/[ۀة]/g,"ه").replace(/ؤ/g,"و").replace(/إ|أ/g,"ا").replace(/[٠-٩]/g,d=>String("٠١٢٣٤٥٦٧٨٩".indexOf(d))).replace(/[۰-۹]/g,d=>String("۰۱۲۳۴۵۶۷۸۹".indexOf(d))).replace(/[ـ]/g,"").replace(/[\u200c\u200f\u200e]/g,"").replace(/[^\p{L}\p{N}]+/gu," ").replace(/\s+/g," ").trim().toLowerCase();
}
function compactName(value){return normalizeName(value).replace(/\s+/g,"");}
function levenshtein(a,b){a=String(a||"");b=String(b||"");let prev=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let cur=[i];for(let j=1;j<=b.length;j++)cur[j]=Math.min(cur[j-1]+1,prev[j]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=cur;}return prev[b.length];}
function productSimilarity(a,b){
  const na=normalizeName(a.name),nb=normalizeName(b.name),ca=compactName(a.name),cb=compactName(b.name);
  if(a.familyId && b.familyId && String(a.familyId)===String(b.familyId) && na!==nb)return 0;
  if(a.masterSku&&b.masterSku&&normalizeName(a.masterSku)===normalizeName(b.masterSku))return 1;
  if(!na||!nb)return 0;
  if(a.unit&&b.unit&&normalizeName(a.unit)!==normalizeName(b.unit))return 0;
  const numsA=(na.match(/\d+(?:[.,]\d+)?/g)||[]).map(x=>x.replace(',','.')).sort(),numsB=(nb.match(/\d+(?:[.,]\d+)?/g)||[]).map(x=>x.replace(',','.')).sort();
  if(numsA.length&&numsB.length&&numsA.join('|')!==numsB.join('|'))return 0;
  if(ca===cb)return .995;
  const ta=new Set(na.split(' ').filter(Boolean)),tb=new Set(nb.split(' ').filter(Boolean));
  const inter=[...ta].filter(x=>tb.has(x)),union=new Set([...ta,...tb]);
  const j=union.size?inter.length/union.size:0,cont=Math.min(ta.size,tb.size)?inter.length/Math.min(ta.size,tb.size):0;

}
function rebuildGlobalProducts(){
  // Global products are rebuilt from Company Products so an old bad grouping cannot survive.
  // Each company product remains a separate record; globalProductId is only the comparison/link key.
  const globals=[];
  state.products.forEach(p=>{
    let best=null,bestScore=0;
    for(const candidate of globals){
      const alreadySameCompany = candidate.companyProductIds.some(pid => { const cp=state.products.find(x=>x.id===pid); return cp && cp.companyId===p.companyId; });
      if(alreadySameCompany) continue;
      const score=productSimilarity(p,{name:candidate.name,unit:candidate.unit,masterSku:candidate.masterSku,familyId:candidate.familyId||""});
      if(score>bestScore){bestScore=score;best=candidate;}
    }
    if(best && bestScore>=.82){
      p.globalProductId=best.id;
      if(!best.masterSku&&p.masterSku)best.masterSku=p.masterSku;
      if(!best.companyProductIds.includes(p.id))best.companyProductIds.push(p.id);

function computeSmartSuggestions(limit) {
  const today = todayISO();
  return state.customers.map((c) => {
    const status = getCustomerStatus(c);
    const visits = state.visits.filter(v => v.customerId === c.id).sort((a,b) => b.date.localeCompare(a.date));
    const last = visits[0];
    const lastOrder = visits.find(v => Array.isArray(v.items) && v.items.length);
    const daysSince = status.days == null ? 999 : status.days;
    let score = (PRIORITY_WEIGHT[c.priority] || 1) * 10;
    let reason = "";
    if (status.key === "critical") { score += 60; reason = "موعد ویزیت"; }
    else if (status.key === "due") { score += 45; reason = "امروز نیاز به ویزیت دارد"; }
    else if (status.key === "soon") { score += 24; reason = "به موعد ویزیت نزدیک است"; }
    else if (status.key === "never") { score += 30; reason = "هنوز ویزیتی برای این مشتری ثبت نشده"; }
    if (lastOrder) {
      const orderDays = daysBetween(lastOrder.date, today);
      if (orderDays >= 14) { score += Math.min(orderDays, 30); if (!reason) reason = "مدتی است سفارشی ثبت نشده"; }
    }
    if ((c.avgOrderValue || 0) >= 2000000) score += 12;
    if (!reason) reason = "اولویت مناسب برای مسیر امروز";
    return Object.assign({}, c, { status, score, reason, lastVisit: last });
  }).sort((a,b) => b.score-a.score).slice(0, limit || 3);
}
function computeTopProducts(limit) {
  const map = {};
  state.visits.forEach(v => (v.items || []).forEach(it => {
    const key = it.productId || normalizeName(it.name || "");
    if (!key) return;
    if (!map[key]) map[key] = { productId: it.productId || "", name: it.name || "کالای بدون نام", qty: 0, amount: 0 };
    map[key].qty += Number(it.qty) || 0;
    map[key].amount += (Number(it.qty) || 0) * (Number(it.unitPrice) || 0);
  }));
  return Object.values(map).sort((a,b) => b.qty-a.qty || b.amount-a.amount).slice(0, limit || 3);
}

function dailyPlanCandidates(coords) {
  const today = todayISO();
  return state.customers.map(c => {
    const status = getCustomerStatus(c);
    const hasGps = c.lat !== "" && c.lat != null && c.lng !== "" && c.lng != null;
    if (coords && !hasGps) return null;
    const distance = coords && hasGps ? Math.round(haversineMeters(coords.lat, coords.lng, Number(c.lat), Number(c.lng))) : null;
    const visits = state.visits.filter(v => v.customerId === c.id).sort((a,b) => b.date.localeCompare(a.date));
    const lastOrder = visits.find(v => Array.isArray(v.items) && v.items.length);
    const orderDays = lastOrder ? daysBetween(lastOrder.date, today) : 999;
    const urgency = status.key === "critical" ? 100 : status.key === "due" ? 82 : status.key === "soon" ? 58 : status.key === "never" ? 66 : 25;
    const priority = c.priority === "بالا" ? 100 : c.priority === "متوسط" ? 60 : 30;
    const value = Math.min(100, ((Number(c.avgOrderValue) || 0) / 3000000) * 100);
    const proximity = distance == null ? 0 : Math.max(0, 100 - (distance / 3000) * 100);
    return { customer:c, status, distance, urgency, priority, value, proximity, orderDays };
  }).filter(Boolean);
}
function routeOrder(items, coords) {
  const remaining = items.slice();
  const route = [];
  let point = coords ? { lat:coords.lat, lng:coords.lng } : null;
  while (remaining.length) {
    let bestIndex = 0, best = Infinity;
    remaining.forEach((x,i) => {
      let d = point && x.distance != null ? haversineMeters(point.lat, point.lng, Number(x.customer.lat), Number(x.customer.lng)) : (x.distance == null ? 0 : x.distance);
      if (d < best) { best = d; bestIndex = i; }
    });
    const next = remaining.splice(bestIndex,1)[0];
    route.push(next);
    if (next.customer.lat !== "" && next.customer.lng !== "") point = {lat:Number(next.customer.lat),lng:Number(next.customer.lng)};
  }
  return route;
}
function buildDailyPackages(coords) {
  const candidates = dailyPlanCandidates(coords);
  if (!candidates.length) return { near:[], sales:[] };
  const pool = candidates.slice().sort((a,b) => {
    const sa = a.urgency*0.45 + a.proximity*0.40 + a.priority*0.15;
    const sb = b.urgency*0.45 + b.proximity*0.40 + b.priority*0.15;
    return sb-sa;
  }).slice(0,5);
  const sales = candidates.slice().sort((a,b) => {
    const sa = a.urgency*0.40 + a.priority*0.25 + a.value*0.20 + a.proximity*0.15;
    const sb = b.urgency*0.40 + b.priority*0.25 + b.value*0.20 + b.proximity*0.15;
    return sb-sa;
  }).slice(0,5);
  return { near: routeOrder(pool, coords), sales: routeOrder(sales, coords) };
}

function findCustomersByDistance(lat, lng, customers, maxDistance) {
  const results = [];
  customers.forEach(c => {
    if (c.lat === "" || c.lat == null || c.lng === "" || c.lng == null) return;
    const d = haversineMeters(lat, lng, Number(c.lat), Number(c.lng));
    if (d <= maxDistance) results.push({ customer:c, distance:Math.round(d) });
  });

function getCompanySalesStats() {
  const stats = {};
  state.companies.forEach(c => { stats[c.id] = { companyId:c.id, name:c.name, code:c.code||"", today:0, month:0, total:0, invoiceCountToday:0, invoiceCountMonth:0, qty:0, topProducts:{} }; });
  const monthKey = getJalaliYearMonth(new Date());
  state.visits.forEach(v => {
    const isToday = v.date === todayISO();
    const isMonth = getJalaliYearMonth(new Date(v.date + "T00:00:00")) === monthKey;
    (v.items || []).forEach(it => {
      const p = state.products.find(pp => pp.id === it.productId);
      const companyId = (p && p.companyId) || v.companyId || "";
      if (!companyId || !stats[companyId]) return;
      const amount = (Number(it.qty)||0) * (Number(it.unitPrice)||0);
      const qty = Number(it.qty)||0;
      const st = stats[companyId];
      st.total += amount; st.qty += qty;
      if (isToday) st.today += amount;
      if (isMonth) st.month += amount;
      const productName = (p && (p.displayName || p.name)) || it.name || "کالای ثبت‌شده";
      if (!st.topProducts[productName]) st.topProducts[productName] = {name:productName, qty:0, sales:0};
      st.topProducts[productName].qty += qty;
      st.topProducts[productName].sales += amount;
    });
  });
  // Invoice counts are counted once per company when the invoice contains at least one item from that company.
  state.visits.forEach(v => {
    const companyIds = new Set();
    (v.items || []).forEach(it => {
      const p = state.products.find(pp => pp.id === it.productId);
      const cid = (p && p.companyId) || v.companyId || "";
      if (cid && stats[cid]) companyIds.add(cid);
    });
    companyIds.forEach(cid => {
      if (v.date === todayISO()) stats[cid].invoiceCountToday++;
      if (getJalaliYearMonth(new Date(v.date + "T00:00:00")) === monthKey) stats[cid].invoiceCountMonth++;
    });
  });
  return Object.values(stats).map(st => {
    st.topProducts = Object.values(st.topProducts).sort((a,b)=>b.qty-a.qty || b.sales-a.sales).slice(0,3);
    return st;
  }).sort((a,b)=>b.month-a.month || b.total-a.total);
}

function openSmartImport() {
  setModal({ type: "smart-import", form: { companyId: state.companies[0] ? state.companies[0].id : "", text: "", result: null } });
}
function parseImportText(raw) {
  const lines = raw.split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
  const rows = [];
  for (const line of lines) {
    // support tab, comma, or multiple spaces
    let parts = line.includes("\t") ? line.split("\t") : (line.includes(",") ? line.split(",") : line.split(/\s{2,}/));
    parts = parts.map((p) => p.trim().replace(/^"|"$/g, ""));
    if (parts.length < 2) continue;
    // skip header-like
    if (/نام|name|کالا|sku/i.test(parts[0]) && /قیمت|price|code/i.test(parts.join(" "))) continue;
    const name = parts[0];
    let code = "", masterSku = "", unit = "عدد", price = 0;
    // heuristics: name | code | masterSku | unit | price  OR name | price
    if (parts.length === 2) {
      price = Number(String(parts[1]).replace(/[^\d.]/g, "")) || 0;
    } else if (parts.length >= 3) {
      code = parts[1] || "";
      if (parts.length >= 5) {
        masterSku = parts[2] || "";
        unit = parts[3] || "عدد";
        price = Number(String(parts[4]).replace(/[^\d.]/g, "")) || 0;
      } else if (parts.length === 4) {
        // name, code, masterSku, price
        masterSku = parts[2] || "";
        price = Number(String(parts[3]).replace(/[^\d.]/g, "")) || 0;
      } else {
        // parts.length === 3: name, code, price
        price = Number(String(parts[2]).replace(/[^\d.]/g, "")) || 0;
      }
    }
    if (!name) continue;
    rows.push({ name, code, masterSku, unit, unitPrice: price });
  }
  return rows;
}
async function runSmartImport() {
  const f = state.modal.form;
  if (!f.companyId) { showToast("اول شرکت را انتخاب کنید"); return; }
  const rows = parseImportText(f.text || "");
  if (!rows.length) { showToast("هیچ ردیف معتبری پیدا نشد"); return; }
  let added = 0, updated = 0;
  const now = new Date().toISOString();
  for (const row of rows) {
    // upsert by companyId + (code or name)
    let existing = null;
    if (row.code) existing = state.products.find((p) => p.companyId === f.companyId && p.code === row.code);
    if (!existing) existing = state.products.find((p) => p.companyId === f.companyId && p.name.trim().toLowerCase() === row.name.trim().toLowerCase());
    if (existing) {
      existing.name = normalizeName(row.name); existing.displayName = row.name;
      existing.unitPrice = row.unitPrice;
      existing.unit = row.unit || existing.unit;
      if (row.masterSku) existing.masterSku = row.masterSku;
      if (row.code) existing.code = row.code;
      existing.updatedAt = now;
      updated++;
    } else {
      state.products.push({
        id: uid(),
        companyId: f.companyId,
        masterSku: row.masterSku || "",
        code: row.code || generateProductCode(state.products),
        name: normalizeName(row.name), displayName: row.name,
        unit: row.unit || "عدد",
        unitPrice: row.unitPrice,
        costPrice: "",
        createdAt: now,
        updatedAt: now,
      });
      added++;
    }
  }
  rebuildGlobalProducts(); await saveProducts(); await saveGlobalProducts();
  state.modal.form.result = { added, updated, total: rows.length };
  render();
  showToast("وارد شد: " + added + " جدید، " + updated + " به‌روز");
}

/* ---- Smart Order Wizard ---- */
function openSmartWizard() {
  if (state.wizard) { state.modal = { type: "smart-wizard" }; render(); return; }
  if (!state.products.length) { showToast("اول کاتالوگ کالاها را وارد کنید"); return; }
  // Group ONLY by a manually-set group code (masterSku). No automatic name-matching guesswork —
  // that turned out unreliable in practice (exact duplicates from "Save As" were still split up).
  // A product with no group code is treated as its own standalone item, never auto-merged with anything.
  const groups = {};
  state.products.forEach((p) => {
    const code = (p.masterSku || "").trim();
    const key = code ? "GRP:" + normalizeName(code) : "SOLO:" + p.id;
    if (!groups[key]) groups[key] = [];
    groups[key].push(p);
  });
  const bestPriceItems = Object.keys(groups).map((key) => {
    const list = groups[key].slice().sort((a, b) => (a.unitPrice || 0) - (b.unitPrice || 0));
    const best = list[0];
    return {
      key,
      name: best.displayName || best.name,
      masterSku: best.masterSku || "",
      unit: best.unit,
      options: list.map((p) => ({ productId: p.id, companyId: p.companyId, companyName: companyName(p.companyId), price: p.unitPrice, code: p.code })),
      selectedProductId: best.id,
      selectedCompanyId: best.companyId,
      qty: 0,
      chosen: false,
    };
  }).sort((a, b) => a.name.localeCompare(b.name, "fa"));

  state.wizard = {
    step: 1, // 1 best-price, 2 split summary, 3 upsell, 4 invoices
    bestPriceItems,
    ordersByCompany: {},
    priorityCompanies: [],
    upsellIndex: 0,
    invoices: [],
    customerId: "",
    paymentMethod: "نقد",
    paymentTermsDays: 0,
  };
  setModal({ type: "smart-wizard" });
}

function wizardToggleItem(key, chosen) {
  const it = state.wizard.bestPriceItems.find((x) => x.key === key);
  if (!it) return;
  it.chosen = chosen;
  if (chosen && !it.qty) it.qty = 1;
  if (!chosen) it.qty = 0;
  render();
}
function wizardSetQtySilent(key, qty) {
  const it = state.wizard.bestPriceItems.find((x) => x.key === key);

  it.chosen = it.qty > 0;
  scheduleWizardStateSave();
}

}
function wizardChangeSupplier(key, productId) {
  const it = state.wizard.bestPriceItems.find((x) => x.key === key);
  if (!it) return;
  const opt = it.options.find((o) => o.productId === productId);
  if (!opt) return;
  it.selectedProductId = opt.productId;
  it.selectedCompanyId = opt.companyId;
  render();
}
function wizardBuildOrders() {
  const by = {};
  state.wizard.bestPriceItems.filter((it) => it.chosen && it.qty > 0).forEach((it) => {
    const opt = it.options.find((o) => o.productId === it.selectedProductId) || it.options[0];
    if (!opt) return;
    if (!by[opt.companyId]) by[opt.companyId] = { companyId: opt.companyId, items: [], total: 0 };
    const line = { productId: opt.productId, name: it.name, qty: it.qty, unitPrice: opt.price, unit: it.unit, masterSku: it.masterSku };
    by[opt.companyId].items.push(line);
    by[opt.companyId].total += line.qty * line.unitPrice;
  });
  state.wizard.ordersByCompany = by;
  // ranking by item count then total
  state.wizard.priorityCompanies = Object.values(by)
    .sort((a, b) => b.items.length - a.items.length || b.total - a.total)
    .map((o) => o.companyId);
  return by;
}
function wizardGoStep2() {
  const by = wizardBuildOrders();
  if (!Object.keys(by).length) { showToast("حداقل یک کالا با تعداد انتخاب کنید"); return; }
  state.wizard.upsellIndex = 0;
  state.wizard.step = 3;
  render();
}
function wizardStartUpsell() {
  state.wizard.upsellIndex = 0;
  state.wizard.step = 3;
  render();
}
function wizardUpsellAdd(productId, qty) {
  const coId = state.wizard.priorityCompanies[state.wizard.upsellIndex];
  if (!coId) return;
  const p = state.products.find((x) => x.id === productId);
  if (!p) return;
  const q = Math.max(1, Number(qty) || 1);
  if (!state.wizard.ordersByCompany[coId]) {
    state.wizard.ordersByCompany[coId] = { companyId: coId, items: [], total: 0 };
  }
  const bucket = state.wizard.ordersByCompany[coId];
  const existing = bucket.items.find((i) => i.productId === productId);
  if (existing) {
    existing.qty += q;
  } else {
    bucket.items.push({ productId, name: p.name, qty: q, unitPrice: p.unitPrice, unit: p.unit, masterSku: p.masterSku || "" });
  }
  bucket.total = bucket.items.reduce((a, i) => a + i.qty * i.unitPrice, 0);
  render();
  showToast("اضافه شد به سبد " + companyName(coId));
}

  if (state.wizard.upsellIndex < state.wizard.priorityCompanies.length - 1) {

    render();

function wizardFinalizeInvoices() {
  const invoices = [];
  let invBase = nextInvoiceNumber();
  state.wizard.priorityCompanies.forEach((coId, idx) => {
    const order = state.wizard.ordersByCompany[coId];

    invoices.push({

      return Object.assign({}, it, { productId: "", name: "", isNew: true });
    }
    const next = Object.assign({}, it, { [key]: value });
    if (key === "productId" && value !== "__new__") {
      next.isNew = false;
      const p = state.products.find((pp) => pp.id === value);
      if (p) { next.name = p.name; next.unitPrice = p.unitPrice; }
    }
    return next;
  });
}

async function submitVisit() {
  const f = state.modal.form;
  if (!f.customerId) return;
  const editingId = state.modal.editingVisitId;

  const items = [];
  let productsChanged = false;
  for (const it of f.items) {
    if (!it.name || !it.name.trim() || !(Number(it.qty) > 0)) continue;
    let productId = it.productId;
    if (it.isNew) {
      let familyId = (it.familyId || "").trim();
      const source = it.variantOfProductId ? state.products.find(p => p.id === it.variantOfProductId) : null;
      if (source) {
        if (f.companyId && String(source.companyId || "") !== String(f.companyId)) {
          showToast("شرکت کالای مبنا با شرکت انتخاب‌شده یکسان نیست"); return;
        }
        familyId = source.familyId || familyId || generateFamilyId();
        if (!source.familyId) source.familyId = familyId;
      }
      const now = new Date().toISOString();
      const displayName = String(it.name).trim();
      const newProduct = {
        id: uid(), code: generateProductCode(state.products), name: normalizeName(displayName), displayName,
        unit: source && source.unit ? source.unit : "عدد", unitPrice: Number(it.unitPrice) || 0, costPrice: "",
        companyId: f.companyId || (source && source.companyId) || "", masterSku: "", familyId: familyId || "",
        createdAt: now, updatedAt: now, variantOfProductId: source ? source.id : ""
      };
      state.products = state.products.concat([newProduct]);
      productId = newProduct.id;
      productsChanged = true;
    } else if (productId) {
      const existingProduct = state.products.find(p => p.id === productId);
      if (!existingProduct) continue;
      if (f.companyId && String(existingProduct.companyId || "") !== String(f.companyId)) {
        showToast("این کالا متعلق به شرکت انتخاب‌شده نیست"); return;
      }
    } else {
      // A typed search term is not a product until the user explicitly chooses + New Product.
      continue;
    }
    items.push({ id: uid(), productId, name: it.name.trim(), qty: Number(it.qty) || 0, unitPrice: Number(it.unitPrice) || 0 });
  }
  if (productsChanged) { rebuildGlobalProducts(); await saveProducts(); await saveGlobalProducts(); }

  const answers = editingId ? (state.visits.find(v => v.id === editingId)?.answers || []) : [];

  if (editingId) {
    state.visits = state.visits.map((v) => {
      if (v.id !== editingId) return v;
      const terms = (f.paymentMethod === "نقد" || f.paymentMethod === "کارت‌به‌کارت / انتقال") ? 0 : Math.max(0, Number(f.paymentTermsDays)||0);
      const updated = Object.assign({}, v, {
        customerId: f.customerId, items, paymentMethod: f.paymentMethod, companyId: f.companyId || "",
        answers, freeNote: f.freeNote || "",
        invoiceNumber: items.length ? (v.invoiceNumber || nextInvoiceNumber()) : v.invoiceNumber,
      });
      // Existing payment history and legacy tracking status are preserved while editing an invoice.
      if (invoiceIsPaymentTracked(v)) {
        updated.paymentTermsDays = terms;
        updated.dueDate = addDaysISO(v.date || todayISO(), terms);
        updated.payments = invoicePayments(v);
      }
      return updated;
    });
    await saveProducts();
    await saveVisits();
    closeModal();
    const updated = state.visits.find((v) => v.id === editingId);
    if (updated && updated.items.length) setModal({ type: "invoiceView", visit: updated });
    else showToast("ویزیت به‌روزرسانی شد");
    return;
  }

  const terms = (f.paymentMethod === "نقد" || f.paymentMethod === "کارت‌به‌کارت / انتقال") ? 0 : Math.max(0, Number(f.paymentTermsDays)||0);
  const entry = {
    id: uid(), date: todayISO(), customerId: f.customerId,
    lat: f.lat || "", lng: f.lng || "",
    items, paymentMethod: f.paymentMethod, companyId: f.companyId || "",
    answers, freeNote: f.freeNote || "",
    invoiceNumber: items.length ? nextInvoiceNumber() : null,
    paymentTracking: items.length > 0,
    paymentTermsDays: terms,
    dueDate: addDaysISO(todayISO(), terms),
    payments: items.length && (f.paymentMethod === "نقد" || f.paymentMethod === "کارت‌به‌کارت / انتقال") ? [{id:uid(), date:todayISO(), amount:items.reduce((sum,it)=>sum+(Number(it.qty)||0)*(Number(it.unitPrice)||0),0), method:f.paymentMethod, status:"cleared", reference:"", note:"پرداخت هنگام ثبت فاکتور"}] :
      (items.length && f.paymentMethod === "چک" ? [{id:uid(), date:todayISO(), amount:items.reduce((sum,it)=>sum+(Number(it.qty)||0)*(Number(it.unitPrice)||0),0), method:"چک", status:"pending", reference:"", note:"چک ثبت‌شده؛ در انتظار وصول"}] : []),
  };
  state.visits = state.visits.concat([entry]);
  state.customers = state.customers.map((c) => (c.id === f.customerId ? Object.assign({}, c, { lastVisitDate: entry.date }) : c));
  await saveProducts();
  await saveVisits();
  await saveCustomers();
  closeModal();
  if (items.length) {
    setModal({ type: "invoiceView", visit: entry });
  } else {
    showToast("ویزیت ثبت شد");
  }
}

/* ---- GPS detect flow on dashboard ---- */
function detectLocation() {
  if (!navigator.geolocation) { state.gps = { status: "error", error: "مرورگر شما از GPS پشتیبانی نمی‌کند.", matches: [], coords: state.gps.coords || null, updatedAt: state.gps.updatedAt || null }; render(); return; }
  const previousCoords = state.gps.coords || null;
  state.gps = { status: "loading", error: "", matches: [], coords: previousCoords, updatedAt: state.gps.updatedAt || null };
  render();
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const coords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      const matches = findCustomersByDistance(coords.lat, coords.lng, state.customers, 3000);
      state.gps = { status: matches.length ? "matched" : "nomatch", error: "", matches, coords, updatedAt: new Date().toISOString() };
      render();
    },
    () => { state.gps = { status: "error", error: "دسترسی به GPS ممکن نشد. اجازه موقعیت مکانی را بررسی کن.", matches: [], coords: previousCoords, updatedAt: state.gps.updatedAt || null }; render(); },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
  );
}
function captureCustomerGps() {
  if (!navigator.geolocation) { state.modal.gps.error = "مرورگر شما از GPS پشتیبانی نمی‌کند."; render(); return; }
  state.modal.gps.loading = true; state.modal.gps.error = ""; render();
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      state.modal.form.lat = pos.coords.latitude.toFixed(6);
      state.modal.form.lng = pos.coords.longitude.toFixed(6);
      state.modal.gps.loading = false;
      render();
    },
    () => { state.modal.gps.loading = false; state.modal.gps.error = "دسترسی به GPS ممکن نشد."; render(); },
    { enableHighAccuracy: true, timeout: 10000 }
  );
}

  if (t.dataset.answerLive) {
    state.modal.form.answers = Object.assign({}, state.modal.form.answers, { [t.dataset.answerQ]: t.value });
  } else if (t.dataset.field) {
    if (t.dataset.item) {
      updateVisitItemSilent(t.dataset.item, t.dataset.field, t.value);
    } else if (state.modal && state.modal.form) {
      state.modal.form[t.dataset.field] = t.type === "checkbox" ? t.checked : t.value;
    }
  } else if (t.dataset.visitCustomerSearch !== undefined) {
    state.visitCustomerSearch = t.value; refreshVisitCustomerResults();
  } else if (t.dataset.customerSearch !== undefined) {
    state.customerSearch = t.value; refreshCustomerResultsList();
  } else if (t.dataset.invoiceSearch !== undefined) {
    state.invoiceSearch = t.value; refreshInvoiceResultsList();
  } else if (t.dataset.invoiceProductSearch !== undefined) {
    const rid=t.dataset.invoiceProductSearch;
    if (state.modal && state.modal.form) {
      const it=state.modal.form.items.find(x=>x.rid===rid);
      if (it) { it.productSearch=t.value; const box=document.querySelector('[data-invoice-product-results="'+rid+'"]'); if(box) box.innerHTML=renderInvoiceProductResults(it); }
    }

    state.productSearch = t.value; const pos=t.selectionStart; render(); const next=document.querySelector('[data-product-search]'); if(next){next.focus(); try{next.setSelectionRange(pos,pos);}catch(e){}}
  }
});
app.addEventListener("change", (e) => {

  if (t.dataset.action === "wizard-customer") { if (state.wizard) { state.wizard.customerId = t.value; if (state.wizard.invoices) state.wizard.invoices.forEach(inv => inv.text = buildCompanyInvoiceText(getCompany(inv.companyId), inv.invoiceNumber, inv.items, inv.total)); scheduleWizardStateSave(); } return; }
  if (t.dataset.action === "wizard-payment-method") { if (state.wizard) { state.wizard.paymentMethod = t.value; render(); } return; }
  if (t.dataset.action === "wizard-payment-terms") { if (state.wizard) { state.wizard.paymentTermsDays = Math.max(0, Math.min(3650, Number(t.value) || 0)); scheduleWizardStateSave(); } return; }
  if (t.id === "import-file-input") { if (t.files && t.files[0]) handleImportFile(t.files[0]); t.value = ""; return; }

function handleAction(action, id, el) {
  if (action === "set-tab") { state.tab = id; state.customerDetailId = null; render(); return; }
  if (action === "close-modal") {
    if (state.modal && state.modal.type === "smart-wizard") { cancelSmartWizard(); return; }
    closeModal(); return;
  }
  if (action === "close-confirm") { state.confirm = null; render(); return; }
  if (action === "confirm-yes") { const fn = state.confirm && state.confirm.onConfirm; state.confirm = null; if (fn) fn(); return; }
  if (action === "reset-all") { resetAllConfirm(); return; }
  if (action === "open-settings") { setModal({ type: "settings", form: Object.assign({}, state.vendorProfile) }); return; }
  if (action === "save-vendor-profile") {
    state.vendorProfile = Object.assign({}, state.modal.form);
    saveVendorProfile();
    closeModal();
    showToast("اطلاعات ویزیتور ذخیره شد");
    return;
  }
  if (action === "export-data") { exportAllData(); return; }
  if (action === "trigger-import") { triggerImportFile(); return; }
  if (action === "open-location") { openLocation(); return; }
  if (action === "open-daily-plan") { openDailyPlan(); return; }
  if (action === "refresh-daily-plan") { detectLocation(); return; }
  if (action === "refresh-location") { detectLocation(); return; }
  if (action === "set-theme") { setTheme(id); return; }
  if (action === "open-new-invoice") { setModal({ type: "quick-invoice", form: { customerId: "", companyId: "" } }); return; }
  if (action === "open-company-sales") { setModal({ type: "company-sales", period: id === "today" ? "today" : "month" }); return; }
  if (action === "open-payments") { setModal({ type: "payments" }); return; }
  if (action === "open-payment-record") { openPaymentRecord(id); return; }
  if (action === "open-payment-status") { openPaymentStatus(id); return; }
  if (action === "save-payment-record") { savePaymentRecord(); return; }
  if (action === "save-payment-status") { savePaymentStatus(); return; }
  if (action === "clear-cheque") { updateChequeStatus(id, "cleared"); return; }
  if (action === "return-cheque") { updateChequeStatus(id, "returned"); return; }
  if (action === "set-invoice-company") { setInvoiceCompany(id); return; }
  if (action === "select-invoice-product") { selectInvoiceProduct(el.dataset.item, id); return; }
  if (action === "start-new-invoice") {
    const sel = document.getElementById("quick-invoice-customer");
    const companySel = document.getElementById("quick-invoice-company");
    if (sel && sel.value) {
      openStartVisit(sel.value, state.gps.coords, companySel ? companySel.value : ((state.modal && state.modal.form && state.modal.form.companyId) || ""));
    } else {
      showToast("ابتدا مشتری را انتخاب کنید");
    }
    return;
  }

  if (action === "open-add-customer") { openAddCustomer(); return; }
  if (action === "open-add-customer-here") {
    const coords = state.gps.coords;
    openAddCustomer(coords ? { lat: coords.lat.toFixed(6), lng: coords.lng.toFixed(6) } : {});
    return;
  }
  if (action === "edit-customer") { openEditCustomer(id); return; }
  if (action === "delete-customer") { deleteCustomerConfirm(id); return; }
  if (action === "save-customer") { saveCustomerForm(); return; }
  if (action === "capture-customer-gps") { captureCustomerGps(); return; }
  if (action === "set-customer-filter") { state.customerFilter = id; render(); return; }

  if (action === "open-add-product") { openAddProduct(); return; }
  if (action === "edit-product") { openEditProduct(id); return; }
  if (action === "delete-product") { deleteProductConfirm(id); return; }
  if (action === "save-product") { saveProductForm(); return; }
  if (action === "save-product-as-new") { saveProductAsNew(); return; }

  if (action === "detect-location") { detectLocation(); return; }
  if (action === "start-visit-matched") {
    openStartVisit(id, state.gps.coords);
    return;
  }
  if (action === "edit-invoice") { openEditVisit(id); return; }
  if (action === "toggle-questions") { toggleQuestionsExpanded(); return; }
  if (action === "whatsapp-invoice") {
    const v = state.visits.find((x) => x.id === id);
    if (v) {
      const cust = state.customers.find((c) => c.id === v.customerId);
      const text = buildInvoiceWhatsAppText(v, cust, state.vendorProfile);
      window.open("https://wa.me/?text=" + encodeURIComponent(text), "_blank");
    }
    return;
  }
  if (action === "open-customer-detail") { state.customerDetailId = id; render(); return; }
  if (action === "back-to-customers") { state.customerDetailId = null; render(); return; }
  if (action === "start-visit-manual") {
    const sel = document.getElementById("manual-customer-select");
    if (sel && sel.value) openStartVisit(sel.value, null);
    return;
  }
  if (action === "start-visit-from-card") { openStartVisit(id, null); return; }
  if (action === "add-item-row") { addItemRowToVisit(); return; }
  if (action === "new-invoice-product") { startNewInvoiceProduct(id); return; }
  if (action === "new-invoice-variant") { startInvoiceProductVariant(id); return; }
  if (action === "invoice-item-search-mode") { returnInvoiceItemToSearch(id); return; }
  if (action === "remove-item-row") { removeItemRowFromVisit(id); return; }
  if (action === "set-answer") { setVisitAnswer(el.dataset.q, el.dataset.val); return; }
  if (action === "submit-visit") { submitVisit(); return; }

  if (action === "view-invoice") {
    const v = state.visits.find((x) => x.id === id);
    if (v) setModal({ type: "invoiceView", visit: v });
    return;
  }
  if (action === "delete-visit") { deleteVisitConfirm(id); return; }
  if (action === "print-invoice") {
    const v=state.visits.find(x=>x.id===(state.modal&&state.modal.visit?state.modal.visit.id:""));
    if(!v)return;
    const cust=state.customers.find(c=>c.id===v.customerId);
    const html=buildInvoiceHtml(v,cust,state.vendorProfile);
    const w=window.open("about:blank","_blank","noopener,noreferrer");
    if(w){ state.modal=null; w.opener=null; w.document.open(); w.document.write(html); w.document.close(); render(); return; }
    // Popup blocked: create a real target=_blank link instead of trapping the user in the app.
    const blob=new Blob([html],{type:"text/html;charset=utf-8"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a"); a.href=url; a.target="_blank"; a.rel="noopener"; a.click();
    setTimeout(()=>URL.revokeObjectURL(url),60000);
    return;
  }

  if (action === "run-ai") { runAiAnalysis(); return; }

  if (action === "open-catalog-hub") { openCatalogHub(); return; }
  if (action === "open-add-company") { openAddCompany(); return; }
  if (action === "edit-company") { openEditCompany(id); return; }
  if (action === "delete-company") { deleteCompanyConfirm(id); return; }
  if (action === "save-company") { saveCompanyForm(); return; }
  if (action === "open-smart-import") { openSmartImport(); return; }
  if (action === "run-smart-import") { runSmartImport(); return; }
  if (action === "open-smart-wizard") { openSmartWizard(); return; }
  if (action === "wizard-step2") { wizardGoStep2(); return; }
  if (action === "wizard-start-upsell") { wizardStartUpsell(); return; }
  if (action === "wizard-next-upsell") { wizardNextUpsell(); return; }
  if (action === "wizard-skip-upsell") { wizardSkipUpsell(); return; }
  if (action === "wizard-finalize") { wizardFinalizeInvoices(); return; }
  if (action === "wizard-save-visits") { wizardSaveAsVisits(state.wizard.customerId); return; }
  if (action === "wizard-upsell-add") {
    const q = document.querySelector('[data-upsell-qty="' + id + '"]');
    wizardUpsellAdd(id, q ? q.value : 1); return;
  }
  if (action === "wizard-whatsapp") { wizardWhatsAppInvoice(Number(id)); return; }
  if (action === "wizard-back-to-company") {
    if (state.wizard) {
      const idx = state.wizard.priorityCompanies.indexOf(id);
      if (idx >= 0) { state.wizard.upsellIndex = idx; state.wizard.step = 3; render(); }
    }
    return;
  }
}

function render() {
  applyTheme(state.theme);
  if (state.loaded && state.wizard) scheduleWizardStateSave();
  if (!state.loaded) {
    app.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;">' + icon("loader", 26) + "</div>";
    return;
  }
  const scrollSelectors = [".modal-sheet", ".wizard-products-list", ".wizard-scroll"];
  const savedScrolls = scrollSelectors.map((sel) => {
    const el = document.querySelector(sel);
    return el ? el.scrollTop : null;
  });
  app.innerHTML =
    renderHeader() +
    '<main>' + renderTab() + '</main>' +
    renderNav() +
    renderModal() +
    renderConfirm() +
    renderToast() +
    '<input type="file" id="import-file-input" accept="application/json" style="display:none" />';
  scrollSelectors.forEach((sel, i) => {
    if (savedScrolls[i] != null) {
      const el = document.querySelector(sel);
      if (el) el.scrollTop = savedScrolls[i];
    }
  });
}

function renderHeader() {
  return (
    '<header class="app-header">' +
      '<div><div class="flex items-center"><span class="brand-title serif">Sales AI</span><span class="version-badge">V5.16</span></div>' +
      '<div class="brand-sub">دستیار میدانی فروش · پیش‌فاکتور و تحلیل هوشمند</div></div>' +
      '<div class="dashboard-v5-smart-header"><button class="dashboard-v5-smart-mini" data-action="open-smart-wizard" title="ویزیت هوشمند">' + icon("sparkles", 17) + '</button><button class="icon-btn" data-action="open-settings" title="تنظیمات">' + icon("settings", 18) + "</button></div>" +
    "</header>"
  );
}

function renderNav() {
  return (
    '<nav class="bottom-nav" style="grid-template-columns:repeat(' + TABS.length + ',1fr)">' +
      TABS.map((t) => (
        '<button class="nav-btn' + (state.tab === t.key ? " active" : "") + '" data-action="set-tab" data-id="' + t.key + '">' +
          icon(t.icon, 20) + "<span>" + t.label + "</span></button>"
      )).join("") +
    "</nav>"
  );
}

function renderToast() {
  if (!state.toast) return "";
  return '<div style="position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:12px;font-weight:700;padding:9px 18px;border-radius:999px;z-index:60;">' + esc(state.toast) + "</div>";
}

function renderTab() {
  if (state.tab === "dashboard") return renderDashboard();
  if (state.tab === "customers") return renderCustomers();
  if (state.tab === "products") return renderProducts();
  if (state.tab === "invoices") return renderInvoices();
  return "";
}

        statCard("users", "مشتریان امروز", formatFaNum(todayCustomers), "") +

        '<span style="text-align:left;white-space:nowrap;"><strong class="serif" style="display:block;font-size:13px;color:'+(paymentOverview.overdueAmount>0?'var(--brick)':'var(--ink)')+';">' + formatToman(paymentOverview.receivables) + '</strong><span class="small muted" style="font-size:9px;">ماندهٔ ثبت‌شده</span></span>' +

function renderSmartSuggestionRow(c) {
  const days = c.status.days;
  const last = days === null ? "هنوز ویزیت نشده" : formatFaNum(days) + " روز از آخرین ویزیت";
  const mapUrl=googleMapsDirectionsUrl(c, state.gps.coords);
  const mapBtn=mapUrl ? '<a class="dashboard-v5-map-btn" href="'+mapUrl+'" target="_blank" rel="noopener noreferrer" title="مسیر تا مغازه">'+icon("nav",14)+'</a>' : '';
  const overdue = days !== null && days > 0;
  return '<div class="row-card dashboard-v5-suggestion"><div style="min-width:0;flex:1;"><div style="font-weight:800;font-size:13px;">'+esc(c.name)+'</div><div class="small" style="color:var(--v1-primary);margin-top:2px;">'+esc(c.reason)+'</div><div class="small" style="color:'+(overdue?'var(--brick)':'var(--ink-soft)')+';margin-top:2px;font-weight:'+(overdue?'800':'500')+';">'+last+'</div></div><div class="dashboard-v5-suggestion-actions">'+mapBtn+'<button class="btn btn-sm btn-primary" data-action="start-visit-from-card" data-id="'+c.id+'">ویزیت</button></div></div>';
}

  return '<div class="modal-backdrop"><div class="modal-sheet location-sheet">' +
    '<div class="modal-head"><div><span class="modal-title serif">مغازه‌های اطراف من</span><div class="small muted" style="margin-top:3px;">مرتب‌شده بر اساس فاصله از موقعیت فعلی</div></div><button data-action="close-modal">'+icon("x",20)+'</button></div>' +
    '<div class="location-toolbar"><span class="small muted">آخرین بروزرسانی: '+updated+'</span><button class="btn btn-outline btn-sm" data-action="refresh-location">'+icon("refresh",14)+' رفرش موقعیت</button></div>' +
    (g.status === "loading" ? '<div class="location-status"><span class="spin">'+icon("loader",16)+'</span>در حال دریافت موقعیت دقیق...</div>' : '') +
    (g.status === "error" ? '<div class="location-status location-error">'+icon("alert",16)+esc(g.error)+'</div>' : '') +

    (g.status !== "loading" && !items.length ? '<div class="location-empty">'+icon("map",22)+'<strong>مغازه‌ای با موقعیت ثبت‌شده پیدا نشد</strong><span>اگر مغازه‌ها موقعیت نداشته باشند، ابتدا موقعیت آنها را هنگام ثبت/ویرایش مشتری ذخیره کن.</span><button class="btn btn-soft-amber btn-block" data-action="open-add-customer-here">'+icon("plus",14)+'ثبت مغازه در این موقعیت</button></div>' : '') +

function renderCustomers() {
  if (state.customerDetailId) return renderCustomerDetail(state.customerDetailId);
  return (
    '<div class="section" style="padding-bottom:24px;">' +
      '<div class="v1-page-head"><div><div class="v1-page-title">مشتریان</div><div class="v1-page-sub">مدیریت مشتری‌ها و شروع ویزیت</div></div>' +
      '<button class="btn btn-primary btn-sm" data-action="open-add-customer">' + icon("plus",14) + 'مشتری جدید</button></div>' +
      '<div class="search-wrap"><input class="input" id="customer-search-input" placeholder="جستجوی نام فروشگاه، کد یا تلفن..." data-customer-search value="' + esc(state.customerSearch) + '" />' + '<span class="search-icon">' + icon("search",15) + '</span></div>' +
      '<div class="flex gap-2" style="overflow-x:auto;padding-bottom:2px;">' +
        CUSTOMER_FILTERS.map((f) => '<button class="chip' + (state.customerFilter === f.key ? ' active' : '') + '" data-action="set-customer-filter" data-id="' + f.key + '">' + f.label + '</button>').join('') +
      '</div>' +
      '<div id="customer-results-list">' + renderCustomerResultsList() + '</div>' +
    '</div>'
  );
}
const CUSTOMER_FILTERS = [
  { key: "all", label: "همه" }, { key: "critical", label: "دیرکرد جدی" }, { key: "due", label: "نیاز به ویزیت" },
  { key: "soon", label: "نزدیک به موعد" }, { key: "ok", label: "به‌روز" },
];
function renderCustomerResultsList() {
  const list = state.customers
    .map((c) => Object.assign({}, c, { status: getCustomerStatus(c) }))
    .filter((c) => (state.customerFilter === "all" ? true : c.status.key === state.customerFilter))
    .filter((c) => (c.name + " " + (c.code || "") + " " + (c.phone || "")).toLowerCase().includes(state.customerSearch.trim().toLowerCase()))
    .sort((a, b) => suggestionScore(b, b.status) - suggestionScore(a, a.status));
  return list.length === 0
    ? renderEmpty("search", "چیزی پیدا نشد", "فیلتر یا جستجو را تغییر بده.")
    : '<div class="flex-col gap-2">' + list.map(renderCustomerCard).join("") + '</div>';
}
function refreshCustomerResultsList() {
  const el = document.getElementById("customer-results-list");
  if (el) el.innerHTML = renderCustomerResultsList();
}
function renderCustomerCard(c) {
  const meta = STATUS_META[c.status.key];
  return (
    '<div class="v1-list-card">' +
      '<div class="flex items-start justify-between gap-2" data-action="open-customer-detail" data-id="' + c.id + '" style="cursor:pointer;">' +
        '<div style="min-width:0;"><div style="font-weight:900;font-size:14px;">' + esc(c.name) + (c.code ? ' <span class="small muted">(' + esc(c.code) + ')</span>' : '') + '</div>' +
        '<div class="small muted" style="margin-top:3px;">' + esc(c.category || 'عمومی') + (c.phone ? ' · ' + esc(c.phone) : '') + '</div></div>' +
        '<span class="badge" style="color:' + meta.color + ';background:' + meta.color + '22;">' + meta.label + '</span>' +
      '</div>' +
      '<div class="small muted" style="margin-top:9px;">' + icon("clock",12) + ' آخرین ویزیت: ' + formatFaDate(c.lastVisitDate) + ' · هر ' + formatFaNum(c.visitFrequency) + ' روز</div>' +
      (c.address ? '<div class="small muted" style="margin-top:5px;">' + icon("map",12) + ' ' + esc(c.address) + '</div>' : '') +
      '<div class="flex items-center gap-2" style="margin-top:11px;">' +
        '<button class="btn btn-primary btn-sm" data-action="start-visit-from-card" data-id="' + c.id + '">' + icon("receipt",13) + 'شروع ویزیت</button>' +
        '<button class="btn btn-outline btn-sm" data-action="open-customer-detail" data-id="' + c.id + '">جزئیات</button>' +
        '<div style="flex:1"></div>' +
        '<button class="btn-icon icon-btn" data-action="edit-customer" data-id="' + c.id + '">' + icon("pencil",14) + '</button>' +
      '</div>' +
    '</div>'
  );
}

function renderCustomerDetail(id) {
  const c = state.customers.find((x) => x.id === id);
  if (!c) { state.customerDetailId = null; return renderCustomers(); }
  const status = getCustomerStatus(c);
  const meta = STATUS_META[status.key];
  const invoices = state.visits.filter((v) => v.customerId === id && v.items && v.items.length).sort((a, b) => (a.date < b.date ? 1 : -1));
  const totalAll = invoices.reduce((a, v) => a + getVisitTotal(v), 0);

  return (
    '<div class="section" style="padding-bottom:24px;">' +
      '<button class="flex items-center gap-1" style="color:var(--ink-soft);font-size:12px;font-weight:800;align-self:flex-start;" data-action="back-to-customers">' + icon("arrowright", 15) + "بازگشت به مشتریان</button>" +

      '<button class="btn btn-primary btn-block" style="padding:16px;font-size:15px;" data-action="start-visit-from-card" data-id="' + c.id + '">' + icon("receipt", 18) + "ثبت فاکتور برای " + esc(c.name) + "</button>" +

      '<div class="card">' +
        '<div class="flex items-start justify-between gap-2">' +
          '<div><div class="serif" style="font-weight:800;font-size:17px;">' + esc(c.name) + (c.code ? ' <span class="small muted">(' + esc(c.code) + ')</span>' : "") + '</div>' +
          '<div class="small muted" style="margin-top:2px;">' + esc(c.category) + "</div></div>" +
          '<span class="badge" style="color:' + meta.color + ';background:' + meta.color + '22;">' + meta.label + "</span>" +
        "</div>" +
        '<div class="flex-col gap-1 small muted" style="margin-top:10px;">' +
          (c.address ? '<div class="flex items-center gap-2">' + icon("map", 12) + esc(c.address) + "</div>" : "") +
          (c.phone ? '<div class="flex items-center gap-2">' + icon("phone", 12) + esc(c.phone) + "</div>" : "") +

     '<select class="select" data-product-sort style="flex:1;min-width:150px;"><option value="latest"'+(state.productSort==="latest"?" selected":"")+'>جدیدترین کالاها</option><option value="name"'+(state.productSort==="name"?" selected":"")+'>مرتب‌سازی: نام</option><option value="company"'+(state.productSort==="company"?" selected":"")+'>مرتب‌سازی: شرکت</option><option value="priceAsc"'+(state.productSort==="priceAsc"?" selected":"")+'>قیمت: کم به زیاد</option><option value="priceDesc"'+(state.productSort==="priceDesc"?" selected":"")+'>قیمت: زیاد به کم</option></select>' +
     '<button class="btn btn-outline btn-sm" data-action="open-smart-import">'+icon("box",14)+'ورود کاتالوگ</button>' +

   '</div>' +
   '<div data-product-results>'+(list.length?'<div class="flex-col gap-2">'+list.map(p=>'<div class="v1-list-card"><div class="flex items-center justify-between gap-2"><div style="min-width:0;"><div style="font-weight:900;font-size:13px;">'+esc(p.displayName||p.name)+'</div><div class="small muted" style="margin-top:3px;">'+esc(p.unit)+(p.companyId?' · '+esc(companyName(p.companyId)):"")+(p.code?' · '+esc(p.code):"")+'</div></div><span class="serif" style="font-weight:900;white-space:nowrap;">'+formatToman(p.unitPrice)+'</span></div><div class="flex items-center gap-2" style="margin-top:9px;"><button class="btn btn-outline btn-sm" data-action="edit-product" data-id="'+p.id+'">'+icon("pencil",13)+'ویرایش</button><button class="btn btn-sm" style="color:var(--brick);background:var(--brick-bg);" data-action="delete-product" data-id="'+p.id+'">'+icon("trash",13)+'حذف</button></div></div>').join('')+'</div>':renderEmpty("box","کالایی پیدا نشد","جستجو را تغییر بده یا یک کالا اضافه کن."))+'</div>' +
 '</div>';
}

function renderInvoices() {
  const total = state.visits.filter(v=>v.items&&v.items.length).reduce((a,v)=>a+getVisitTotal(v),0);
  const count = state.visits.filter(v=>v.items&&v.items.length).length;
  return (
    '<div class="section" style="padding-bottom:24px;">' +
      '<div class="v1-page-head"><div><div class="v1-page-title">فاکتور</div><div class="v1-page-sub">ثبت سفارش مشتری و سوابق فروش</div></div>' +
      '<button class="btn btn-primary btn-sm" data-action="open-new-invoice">'+icon("plus",14)+'ثبت فاکتور</button></div>' +
      '<div class="v1-primary-block"><div style="font-size:11px;opacity:.78;">فروش ثبت‌شده</div><div class="serif" style="font-size:24px;font-weight:900;margin-top:4px;">'+formatToman(total)+'</div><div style="font-size:10px;opacity:.72;margin-top:5px;">'+formatFaNum(count)+' فاکتور</div></div>' +
      '<div class="search-wrap"><input class="input" id="invoice-search-input" placeholder="جستجو: مشتری، کد یا شماره فاکتور..." data-invoice-search value="'+esc(state.invoiceSearch)+'"/><span class="search-icon">'+icon("search",15)+'</span></div>' +
      '<div id="invoice-results-list">'+renderInvoiceResultsList()+"</div>"+
    '</div>'
  );
}
function renderInvoiceResultsList() {
  const q = state.invoiceSearch.trim().toLowerCase();
  const list = [...state.visits]
    .filter((v) => v.items && v.items.length)
    .filter((v) => {
      if (!q) return true;
      const cust = state.customers.find((c) => c.id === v.customerId);
      const hay = ((cust ? cust.name : "") + " " + (cust ? cust.code || "" : "") + " " + (v.invoiceNumber || "")).toLowerCase();
      return hay.includes(q);
    })
    .sort((a, b) => (a.date < b.date ? 1 : -1));
  return list.length === 0
    ? renderEmpty("receipt", "فاکتوری پیدا نشد", "از داشبورد یک ویزیت رو شروع کن و برای مشتری فاکتور بزن، یا جستجو را تغییر بده.")
    : '<div class="flex-col gap-2">' + list.map(renderInvoiceRow).join("") + "</div>";
}
function refreshInvoiceResultsList() {
  const el = document.getElementById("invoice-results-list");
  if (el) el.innerHTML = renderInvoiceResultsList();
}

function renderInvoiceRow(v) {
  const cust = state.customers.find((c) => c.id === v.customerId);
  const total = getVisitTotal(v);
  const pm = PAYMENT_META[v.paymentMethod] || {};
  return (
    '<div class="row-card">' +
      '<div style="min-width:0;">' +
        '<div class="flex items-center gap-2"><span style="font-weight:800;font-size:13px;">' + esc(cust ? cust.name : "مشتری حذف‌شده") + (cust && cust.code ? ' <span class="small muted">(' + esc(cust.code) + ')</span>' : "") + '</span><span class="small muted">#' + formatFaNum(v.invoiceNumber) + "</span></div>" +
        '<div class="flex items-center gap-2 small muted" style="margin-top:2px;"><span>' + formatFaDate(v.date) + '</span><span class="badge" style="color:' + pm.color + ";background:" + pm.bg + ';">' + esc(v.paymentMethod) + "</span></div>" +
      "</div>" +
      '<div class="flex items-center gap-1" style="flex-wrap:wrap;justify-content:flex-end;max-width:55%;">' +
        '<span style="display:flex;flex-direction:column;align-items:flex-end;gap:3px;"><span class="serif" style="font-weight:800;font-size:13px;color:var(--green);">' + formatToman(total) + "</span>" +
        '<span class="payment-status-chip" style="'+(isInvoiceOverdue(v)?'background:#FBE9E7;color:#A33B32;':'')+'">'+(invoiceIsPaymentTracked(v)?formatToman(getInvoiceBalance(v))+' · ':'')+esc(getInvoicePaymentLabel(v))+'</span></span>' +
        '<button class="btn-icon icon-btn" data-action="view-invoice" data-id="' + v.id + '">' + icon("receipt", 14) + "</button>" +
        '<button class="btn-icon icon-btn" data-action="edit-invoice" data-id="' + v.id + '">' + icon("pencil", 14) + "</button>" +
        '<button class="btn-icon icon-btn" style="color:var(--brick);" data-action="delete-visit" data-id="' + v.id + '">' + icon("trash", 14) + "</button>" +
      "</div>" +
    "</div>"
  );
}

function renderModal() {
  if (!state.modal) return "";
  const m = state.modal;
  if (m.type === "customer") return renderCustomerModal(m);
  if (m.type === "product") return renderProductModal(m);
  if (m.type === "visit") return renderVisitModal(m);
  if (m.type === "invoiceView") return renderInvoiceModal(m);
  if (m.type === "quick-invoice") return renderQuickInvoiceModal();
  if (m.type === "company-sales") return renderCompanySalesModal(m.period);
  if (m.type === "payments") return renderPaymentsModal();
  if (m.type === "payment-record") return renderPaymentRecordModal(m);
  if (m.type === "payment-status") return renderPaymentStatusModal(m);
  if (m.type === "location") return renderLocationModal();
  if (m.type === "daily-plan") return renderDailyPlanModal();
  if (m.type === "settings") return renderSettingsModal(m);
  if (m.type === "company") return renderCompanyModal(m);
  if (m.type === "catalog-hub") return renderCatalogHub();
  if (m.type === "smart-import") return renderSmartImportModal(m);
  if (m.type === "smart-wizard") return renderSmartWizardModal();
  return "";
}

  const w = state.wizard;
  if (!w) return "";

  if (w.step === 1) {
    body =
      '<div class="small muted" style="margin-bottom:10px;flex:0 0 auto;">گام ۱ — مقایسه بهترین قیمت. کالاهای مشابه بین شرکت‌ها زیر یک کالای واحد مقایسه می‌شوند.</div>' +
      '<div class="wizard-products-list">' +
      w.bestPriceItems.map((it) => {
        const best = it.options[0];
        const selected = it.options.find((o) => o.productId === it.selectedProductId) || best;
        const competitorHtml = (!state.vendorProfile.hideCompetitorPrices && it.options.length > 1) ?
          '<div style="margin-top:7px;padding-top:7px;border-top:1px dashed var(--line);">' +
          '<div class="small muted" style="margin-bottom:4px;">شرکت‌های دیگر</div>' +

          '</select></div>' : '';
        return '<div class="card" data-wizard-card="' + esc(it.key) + '" style="padding:10px;' + (it.chosen ? "border-color:var(--amber-dark);" : "") + '">' +
          '<div class="flex items-center" style="justify-content:space-between;gap:8px;">' +
            '<label class="flex items-center gap-2" style="flex:1;"><input type="checkbox" data-action="wizard-toggle" data-id="' + esc(it.key) + '"' + (it.chosen ? " checked" : "") + ' />' +

          '</div>' +

    body =

        '<div class="small" style="font-weight:700;margin-bottom:6px;">این سفارش برای کدوم مشتریه؟ (اختیاری، برای ثبت در سابقه)</div>' +
